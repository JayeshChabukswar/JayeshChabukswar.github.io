name: Daily cybersecurity dashboard update

on:
  schedule:
    # 23:00 India Standard Time (UTC+05:30) = 17:30 UTC
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh dashboard data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_progress.py

      - name: Validate JSON
        run: python -m json.tool data/progress.json > /dev/null

      - name: Commit only when data changed
        run: |
          if git diff --quiet -- data/progress.json; then
            echo "No dashboard data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git commit -m "Refresh cybersecurity dashboard data"
          git push
